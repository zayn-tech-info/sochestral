# Sochestral web (marketing + product UI)
# From this directory:
#   fly apps create sochestral   # first time only
#   fly deploy
# Domains:
#   fly certs add sochestral.shop
#   fly certs add app.sochestral.shop

app = "sochestral"
primary_region = "lhr"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
