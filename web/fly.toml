# fly.toml app configuration file generated for sochestral on 2026-08-06T14:52:57Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sochestral'
primary_region = 'lhr'

[build]
  [build.args]
    NEXT_PUBLIC_API_URL = "https://api.sochestral.shop"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
