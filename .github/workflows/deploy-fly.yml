# Push to main → deploy Sochestral web and/or product API to Fly (path-filtered).
#
# One-time GitHub setup:
#   1. Create a deploy token with access to apps `sochestral` and `sochestral-api`:
#        fly tokens create deploy -x 999999h -a sochestral
#        (or org-level deploy token)
#   2. Repo → Settings → Secrets and variables → Actions → New secret:
#        FLY_API_TOKEN = <token>
#
# Web bakes NEXT_PUBLIC_API_URL from web/fly.toml [build.args] at image build time.

name: Deploy Fly

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "What to deploy"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - web
          - api

concurrency:
  group: fly-sochestral
  cancel-in-progress: true

jobs:
  changes:
    name: Detect paths
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.set.outputs.web }}
      api: ${{ steps.set.outputs.api }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            web:
              - 'web/**'
              - '.github/workflows/deploy-fly.yml'
            api:
              - 'packages/**'
              - 'scripts/**'
              - 'Dockerfile.api'
              - 'fly.api.toml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/deploy-fly.yml'

      - name: Resolve deploy targets
        id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            target="${{ github.event.inputs.target }}"
            web=false; api=false
            [ "$target" = "web" ] || [ "$target" = "both" ] && web=true
            [ "$target" = "api" ] || [ "$target" = "both" ] && api=true
            echo "web=$web" >> "$GITHUB_OUTPUT"
            echo "api=$api" >> "$GITHUB_OUTPUT"
          else
            echo "web=${{ steps.filter.outputs.web }}" >> "$GITHUB_OUTPUT"
            echo "api=${{ steps.filter.outputs.api }}" >> "$GITHUB_OUTPUT"
          fi

  deploy-web:
    name: Deploy sochestral (web)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy web
        working-directory: web
        run: flyctl deploy --remote-only --app sochestral --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-api:
    name: Deploy sochestral-api
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy API
        run: flyctl deploy --remote-only --app sochestral-api --config fly.api.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
