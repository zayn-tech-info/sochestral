# Sochestral product API (Hono)
# From monorepo root:
#   fly apps create sochestral-api
#   fly postgres create ...  OR attach existing Postgres (sets DATABASE_URL)
#   fly secrets set JWT_SECRET=... CORS_ORIGIN=https://app.sochestral.shop ...
#   fly deploy -c fly.api.toml
# Domain:
#   fly certs add api.sochestral.shop -a sochestral-api

app = "sochestral-api"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile.api"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  # CORS_ORIGIN / DATABASE_URL / JWT_SECRET / SOCIALMCP_* as secrets

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "40s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
